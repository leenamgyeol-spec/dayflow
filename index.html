<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>DAYFLOW</title>
  <meta name="description" content="당신의 하루를 기억하고, 더 나은 하루를 설계합니다.">
  <meta name="theme-color" content="#f7f7f8">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="css/style.css?v=12">
  <script>
    try { var t = JSON.parse(localStorage.getItem('dayflow:theme') || '"system"'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <a class="brand" href="#/today"><span class="brand-mark"></span>DAYFLOW</a>
      <nav id="side-nav" class="side-nav" aria-label="주 메뉴"></nav>
      <p class="side-foot">당신의 하루를 기억하고,<br>더 나은 하루를 설계합니다.</p>
    </aside>
    <main id="view" class="view" tabindex="-1"><p class="muted center loading">불러오는 중…</p></main>
  </div>
  <button id="fab" class="fab" aria-label="빠른 일정 추가"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
  <nav id="tabbar" class="tabbar" aria-label="주 메뉴"></nav>
  <div id="modal-root"></div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
  <noscript>DAYFLOW를 사용하려면 자바스크립트를 켜 주세요.</noscript>

  <script src="js/time.js?v=12"></script>
  <script src="js/db.js?v=12"></script>
  <script src="js/store.js?v=12"></script>
  <script src="js/nlp.js?v=12"></script>
  <script src="js/weather.js?v=12"></script>
  <script src="js/brief.js?v=12"></script>
  <script src="js/ui.js?v=12"></script>
  <script src="js/notify.js?v=12"></script>
  <script src="js/push.js?v=12"></script>
  <script src="js/chat.js?v=12"></script>
  <script src="js/app.js?v=12"></script>
</body>
</html>
